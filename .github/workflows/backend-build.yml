name: Build & Push Backend

on:
  push:
    branches:
      - main

jobs:

  ventas:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ventas
        run: |
          docker build \
          -t renattoduoc/ventas-backend:latest \
          ./back-Ventas_SpringBoot/Springboot-API-REST

      - name: Push ventas
        run: |
          docker push renattoduoc/ventas-backend:latest

  despachos:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build despachos
        run: |
          docker build \
          -t renattoduoc/despachos-backend:latest \
          ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO

      - name: Push despachos
        run: |
          docker push renattoduoc/despachos-backend:latest